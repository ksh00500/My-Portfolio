# Safe for an existing PostgreSQL 17 database. NO db/seed/bootstrap services.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for existing portfolio-postgres on portfolio-net}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  portfolio-net:
    external: true
    name: portfolio-net
