/* STEP 35 — organic technology map + slightly higher overall visibility */
:root{--muted:#BBC0C7;--subtle:#9AA2AB;}
.grain{opacity:.08!important}
.hero:after{box-shadow:inset 0 0 130px 28px #03030472!important}
.hero-caption,.section-lead,.archive-hero p,.case-copy,.act-caption p,.award-mini span:not(.laurel-icon),.milestone p,.network-size-note,.network-map-caption{color:#C7D0D8!important}
.overline,.chapter-strip,.hero-foot,.archive-note,.bio-meta span,.film-top,.detail-overline{color:#A7B0B8!important}
.section-head h2,.about-quote h2,.laurel-center h3,.case-sidebar h2,.large-copy,.act-caption h3,.project-result h3,.archive-record h3,.milestone h3{letter-spacing:-0.045em}
.hero-title,.feature-title{filter:drop-shadow(0 6px 24px rgba(0,0,0,.25));}
.pill-link,.network-associated,.project-result,.archive-record,.award-mini{box-shadow:0 8px 24px rgba(0,0,0,.08)}

/* organic tech network */
.organic-shell .network-stage-layout{grid-template-columns:minmax(0,1fr) minmax(300px,360px);align-items:start}
.organic-shell .network-map-frame{height:clamp(560px,63vw,780px);background:radial-gradient(circle at 50% 46%,rgba(20,37,47,.75),rgba(11,17,23,.92) 58%,rgba(8,12,18,1) 100%);border:1px solid #395565}
.organic-shell .network-detail{border:1px solid #47667b;background:linear-gradient(180deg,#142532,#101b24)}
.organic-toolbar .network-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:#d2dde5}
.network-legend-active,.network-legend-line{display:inline-block;width:18px;height:10px;border-radius:99px;vertical-align:middle;margin-right:4px}
.network-legend-active{background:#00D2AC;box-shadow:0 0 12px rgba(0,210,172,.45)}
.network-legend-line{height:2px;width:22px;background:#7CA1B4;border-radius:0;position:relative;top:-3px}
.organic-meta{justify-content:flex-start;gap:16px}
.organic-subtitle{font-size:12px;fill:#9CB4C2;letter-spacing:.02em}
.organic-edge{fill:none;stroke:#7B9FB2;stroke-width:var(--w);stroke-opacity:var(--o);transition:stroke-opacity .2s, stroke .2s}
.organic-edge.active{stroke:#00D2AC;stroke-opacity:.95;filter:drop-shadow(0 0 8px rgba(0,210,172,.35))}
.organic-edge.muted{stroke-opacity:.08}
.organic-node{cursor:pointer;transition:opacity .18s ease}
.organic-node.dimmed{opacity:.26}

  <script>
/* Portfolio technology network — organic distribution view.
   Only technologies are displayed on the map. Node size = number of linked projects.
   Selected node uses mint; related projects are shown in the side panel. */
(function(){
'use strict';
const W=1600,H=980;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelShort=(s,max=18)=>String(s||'').length>max?String(s).slice(0,max-1)+'…':String(s||'');
const techKey=id=>'t:'+id;
let camera={x:0,y:0,w:W,h:H}, context=null, graph=null;
const isEnglish=()=>context?.lang==='en';
const words=(ko,en)=>isEnglish()?en:ko;
const locFor=context=>context?.loc||((r='')=>'#/ko'+(r?'/'+r:''));
function hashSeed(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(str){let s=hashSeed(str)||1;return ()=>{s=(1664525*s+1013904223)>>>0;return s/4294967296;}}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.hypot(dx,dy)||0.0001;}

function buildGraph(db){
 const techs=(db.technologies||[]).filter(t=>t.is_public!==false).map(t=>({
  ...t,
  key:techKey(t.id),
  kind:'tech',
  projects:(t.linked_project_slugs||[]).slice(),
  degree:(t.linked_project_slugs||[]).length
 }));
 const projectBySlug=new Map((db.projects||[]).filter(p=>p.is_public!==false).map(p=>[p.slug,p]));
 const byKey=new Map(techs.map(t=>[t.key,t]));
 const maxDegree=Math.max(1,...techs.map(t=>t.degree));
 
 // tech-tech edges based on shared projects
 const edges=[];
 const neighborMap=new Map(techs.map(t=>[t.key,[]]));
 for(let i=0;i<techs.length;i++){
  for(let j=i+1;j<techs.length;j++){
   const a=techs[i],b=techs[j];
   const common=a.projects.filter(slug=>b.projects.includes(slug));
   if(!common.length) continue;
   const edge={a:a.key,b:b.key,weight:common.length,projects:common};
   edges.push(edge);
   neighborMap.get(a.key).push({key:b.key,weight:common.length,projects:common});
   neighborMap.get(b.key).push({key:a.key,weight:common.length,projects:common});
  }
 }
 const cx=W/2, cy=H/2+18;
 const inner=120, outer=Math.min(W,H)*0.39;
 const sorted=[...techs].sort((a,b)=>b.degree-a.degree || a.name.localeCompare(b.name));
 sorted.forEach((t,index)=>{
  const rand=seeded(t.id+t.name);
  const norm=t.degree/maxDegree;
  t.r=24 + Math.pow(norm||0.0001,0.72)*40;
  const rank=index/Math.max(1,sorted.length-1);
  const radiusBias=(1-norm)*0.72 + rank*0.24;
  const desired=inner + radiusBias*(outer-inner) + (rand()-0.5)*44;
  const angle=rand()*Math.PI*2;
  t.x=cx+Math.cos(angle)*desired;
  t.y=cy+Math.sin(angle)*desired*0.78;
  t.targetRadius=desired;
  t.angle=angle;
 });
 // Relaxation layout: bigger nodes tend center, edges pull together, nodes repel.
 for(let iter=0;iter<360;iter++){
  for(let i=0;i<sorted.length;i++){
   const a=sorted[i];
   let fx=0,fy=0;
   // gentle pull to ring target and center
   const dx=a.x-cx, dy=(a.y-cy)/0.82;
   const current=Math.hypot(dx,dy)||0.0001;
   const drift=(a.targetRadius-current)*0.015;
   fx += (dx/current)*drift;
   fy += (dy/current)*drift*0.82;
   fx += (cx-a.x)*0.00055*(a.degree+1);
   fy += (cy-a.y)*0.00055*(a.degree+1);
   for(let j=i+1;j<sorted.length;j++){
    const b=sorted[j];
    const ddx=a.x-b.x, ddy=a.y-b.y;
    let d=Math.hypot(ddx,ddy)||0.001;
    const minGap=a.r+b.r+18;
    if(d<minGap){
      const push=(minGap-d)*0.048;
      const ux=ddx/d, uy=ddy/d;
      fx += ux*push; fy += uy*push;
      b.x -= ux*push; b.y -= uy*push;
    }
   }
   const neighbors=neighborMap.get(a.key);
   for(const n of neighbors){
    const b=byKey.get(n.key); if(!b) continue;
    const ddx=b.x-a.x, ddy=b.y-a.y;
    const d=Math.hypot(ddx,ddy)||0.001;
    const desiredLen=140 + (maxDegree-Math.min(a.degree,b.degree))*8;
    const pull=(d-desiredLen)*0.0018*Math.min(2.2,n.weight);
    fx += ddx*pull; fy += ddy*pull;
   }
   a.x += fx; a.y += fy;
   a.x = clamp(a.x, 88+a.r, W-88-a.r);
   a.y = clamp(a.y, 92+a.r, H-92-a.r);
  }
 }
 return {techs,edges,neighborMap,projectBySlug,maxDegree,byKey};
}

function edgePath(a,b,weight,selectedKey){
 const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
 const dx=b.x-a.x, dy=b.y-a.y;
 const len=Math.hypot(dx,dy)||1;
 const nx=-dy/len, ny=dx/len;
 const seed=seeded(a.key+b.key)();
 const bend=(18+seed*28) * (a.key<b.key?1:-1);
 const cx=mx + nx*bend;
 const cy=my + ny*bend;
 return `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
}

function renderGraphSvg(g,selected){
 const edges=g.edges.map(e=>{
  const a=g.byKey.get(e.a), b=g.byKey.get(e.b);
  const active=selected && (e.a===selected || e.b===selected);
  return `<path class="organic-edge ${active?'active':''} ${selected&&!active?'muted':''}" d="${edgePath(a,b,e.weight,selected)}" data-edge-a="${escapeHtml(e.a)}" data-edge-b="${escapeHtml(e.b)}" style="--w:${(0.8+e.weight*0.65).toFixed(2)};--o:${Math.min(0.6,0.16+e.weight*0.12).toFixed(2)}"></path>`;
 }).join('');
 const nodes=g.techs.map(t=>{
  const active=t.key===selected;
  const related=selected && g.neighborMap.get(selected)?.some(n=>n.key===t.key);
  const dimmed=selected && !active && !related;
  return `<g class="organic-node ${active?'chosen':''} ${related?'neighbor':''} ${dimmed?'dimmed':''}" data-node-key="${escapeHtml(t.key)}" role="button" tabindex="0" aria-label="${escapeHtml(t.name)} / ${t.degree} ${words('개 프로젝트','projects')}">
    <title>${escapeHtml(t.name)} — ${t.degree} ${words('개 프로젝트 연결','linked projects')}</title>
    <circle cx="${t.x.toFixed(1)}" cy="${t.y.toFixed(1)}" r="${(t.r+12).toFixed(1)}" class="organic-node-halo"></circle>
    <circle cx="${t.x.toFixed(1)}" cy="${t.y.toFixed(1)}" r="${t.r.toFixed(1)}" class="organic-node-circle"></circle>
    <text x="${t.x.toFixed(1)}" y="${(t.y+4).toFixed(1)}" text-anchor="middle" class="organic-node-mono">${escapeHtml((t.name.match(/[A-Za-z0-9]+/g)||['T'])[0].slice(0,3).toUpperCase())}</text>
    <text x="${t.x.toFixed(1)}" y="${(t.y+t.r+20).toFixed(1)}" text-anchor="middle" class="organic-node-label">${escapeHtml(labelShort(t.name,18))}</text>
    <text x="${(t.x+t.r*0.72).toFixed(1)}" y="${(t.y-t.r*0.68).toFixed(1)}" text-anchor="middle" class="organic-node-count">${t.degree}</text>
  </g>`;
 }).join('');
 return `<svg id="portfolio-network" class="portfolio-network" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="${words('기술 분포 네트워크','Technology distribution network')}">
  <defs>
    <pattern id="organic-dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.2" fill="#80a6b9" opacity=".10"/></pattern>
    <radialGradient id="organic-core" cx="50%" cy="48%" r="55%"><stop offset="0%" stop-color="#1c3240" stop-opacity=".84"/><stop offset="72%" stop-color="#0f1820" stop-opacity=".35"/><stop offset="100%" stop-color="#0a1017" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#organic-dots)"/>
  <ellipse cx="${W/2}" cy="${H/2+18}" rx="420" ry="290" fill="url(#organic-core)" opacity=".7"></ellipse>
  <text x="68" y="52" class="network-column-title">${words('TECH DISTRIBUTION MAP','TECH DISTRIBUTION MAP')} <tspan class="network-col-count">${g.techs.length}</tspan></text>
  <text x="68" y="78" class="organic-subtitle">${words('큰 원은 가운데, 작은 원은 바깥에 배치됩니다. 크기는 연결된 프로젝트 수 기준입니다.','Larger nodes gather near the center; smaller ones spread outward. Size reflects linked project count.')}</text>
  <g class="organic-edges">${edges}</g>
  <g class="organic-nodes">${nodes}</g>

 </svg>`;

function toolbar(g){
 const linked=g.techs.filter(t=>t.degree>0).length;
 return `<div class="network-toolbar organic-toolbar"><div class="network-legend"><span class="network-legend-tech"></span>${words('기술 노드','TECH NODE')} <span class="network-legend-active"></span>${words('선택됨','SELECTED')} <span class="network-legend-line"></span>${words('공동 사용 관계','CO-USAGE LINK')}</div>
 </div><div class="network-meta organic-meta"><strong>${g.techs.length} ${words('개 기술','TECHS')}</strong><strong>${linked} ${words('개 연결 기술','LINKED')}</strong><strong>${g.edges.length} ${words('개 조합 관계','CO-USAGE LINKS')}</strong></div><p class="network-size-note" id="network-size-note">${words('노드 크기는 연결된 프로젝트 개수 기준입니다. 실제 시간 투입량이 아니라 사용 빈도를 보여줍니다.','Node size reflects how many projects each technology is linked to. It indicates usage frequency, not time spent.')}</p>`;
}

function panel(g,selected,lang,loc){
 if(!selected){
  return `<div class="network-detail-heading">${words('ORGANIC TECH ATLAS','ORGANIC TECH ATLAS')}</div><h3>${words('기술을 선택해 주세요','Select a technology')}</h3><div class="network-detail-meta">${words('기술만 표시되는 분포도입니다. 큰 기술은 가운데, 작은 기술은 바깥으로 배치했고, 함께 사용된 기술끼리는 거미줄처럼 연결했습니다.','This distribution map shows technologies only. Larger nodes sit closer to the center, smaller nodes drift outward, and co-used technologies are connected like a web.')}</div><div class="network-detail-divider"></div><div class="network-no-links">${words('노드를 클릭하면 숙련 상태와 연결된 프로젝트 전체를 오른쪽에서 확인할 수 있습니다.','Click a node to inspect its proficiency and the full list of connected projects.')}</div>`;
 }
 const t=g.byKey.get(selected); if(!t) return '';
 const relatedProjects=t.projects.map(slug=>g.projectBySlug.get(slug)).filter(Boolean);
 const neighbors=(g.neighborMap.get(t.key)||[]).sort((a,b)=>b.weight-a.weight).map(n=>({tech:g.byKey.get(n.key),...n})).filter(x=>x.tech);

 const neighborList=neighbors.length?neighbors.slice(0,8).map(n=>`<button class="network-associated" type="button" data-node-key="${escapeHtml(n.tech.key)}"><span>${escapeHtml(n.tech.name)}</span><span>${n.weight}</span></button>`).join(''):`<div class="network-no-links">${words('공동 사용된 기술 기록이 없습니다.','No co-used technologies recorded.')}</div>`;

}

function render({db,state,lang,loc}){

 const g=buildGraph(db); graph=g;

}

function mount({db,state,lang,loc}){

 context={db,state,lang,loc};

 let selected=state.networkSelected;

 const frame=container.querySelector('#network-map-frame');
 const desktop=frame.clientWidth>=650;
 camera=desktop?{x:0,y:0,w:W,h:H}:{x:120,y:80,w:1260,h:770};
 function applyCamera(){container.querySelector('#portfolio-network')?.setAttribute('viewBox',`${camera.x} ${camera.y} ${camera.w} ${camera.h}`)}
 applyCamera();
 function refresh(){
  const key=state.networkSelected;
  container.querySelectorAll('.organic-node').forEach(n=>{
   const nk=n.dataset.nodeKey;
   const related=key && (g.neighborMap.get(key)||[]).some(x=>x.key===nk);

   n.classList.toggle('neighbor', !!related);
   n.classList.toggle('dimmed', !!key && nk!==key && !related);
  });

   const on=key && (e.dataset.edgeA===key || e.dataset.edgeB===key);
   e.classList.toggle('active', !!on);
   e.classList.toggle('muted', !!key && !on);
  });
 }

 container.addEventListener('click',e=>{
   const node=e.target.closest('[data-node-key]'); if(node){choose(node.dataset.nodeKey); return;}
   const zoomBtn=e.target.closest('[data-network-zoom]'); if(zoomBtn){zoom(zoomBtn.dataset.networkZoom); return;}
 });
 container.addEventListener('keydown',e=>{const node=e.target.closest('[data-node-key]'); if(node && (e.key==='Enter'||e.key===' ')){e.preventDefault(); choose(node.dataset.nodeKey);}});

 frame.addEventListener('pointerdown',e=>{if(e.target.closest('[data-node-key]')) return; currentDrag={id:e.pointerId,x:e.clientX,y:e.clientY,vx:camera.x,vy:camera.y}; frame.setPointerCapture(e.pointerId); frame.classList.add('dragging');});
 frame.addEventListener('pointermove',e=>{if(!currentDrag||e.pointerId!==currentDrag.id) return; const bb=frame.getBoundingClientRect(); const rx=camera.w/bb.width, ry=camera.h/bb.height; camera.x=clamp(currentDrag.vx-(e.clientX-currentDrag.x)*rx,-120,W+120-camera.w); camera.y=clamp(currentDrag.vy-(e.clientY-currentDrag.y)*ry,-120,H+120-camera.h); applyCamera();});
 const release=()=>{currentDrag=null; frame.classList.remove('dragging')}; frame.addEventListener('pointerup',release); frame.addEventListener('pointercancel',release);
 function zoom(action){ if(action==='fit'){camera={x:0,y:0,w:W,h:H}; applyCamera(); return;} const factor=action==='in'?0.82:1.22; const targetW=clamp(camera.w*factor,420,W), targetH=clamp(camera.h*factor,320,H); const midX=camera.x+camera.w/2, midY=camera.y+camera.h/2; camera={x:clamp(midX-targetW/2,-120,W+120-targetW), y:clamp(midY-targetH/2,-120,H+120-targetH), w:targetW, h:targetH}; applyCamera(); }
 frame.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey)) return; e.preventDefault(); zoom(e.deltaY<0?'in':'out');},{passive:false});
 refresh();
 }
 window.PortfolioNetwork={render,mount};
})();

function makeExperienceRecords(){

  const duplicateProgramIds=new Set(['prog-04','prog-07','prog-10','prog-14','prog-27','prog-28']);
  return [...db.recognitions.map(x=>({...x,kind:x.type,date:x.date,role:state.lang==='ko'?x.award:x.award_en})),

}

function initBehaviour(){document.getElementById('lang-toggle')?.addEventListener('click',()=>swapLang());const menu=document.getElementById('menu-toggle');menu?.addEventListener('click',()=>{let m=document.getElementById('mobile-nav');m.hidden=!m.hidden;menu.setAttribute('aria-expanded',String(!m.hidden));});document.querySelectorAll('.mobile-nav a').forEach(a=>a.addEventListener('click',()=>{document.getElementById('mobile-nav').hidden=true;}));document.querySelectorAll('[data-scroll-contact]').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();if(state.route){location.hash=loc();setTimeout(()=>document.getElementById('contact')?.scrollIntoView({behavior:'smooth'}),110);}else document.getElementById('contact')?.scrollIntoView({behavior:'smooth'});}));document.querySelectorAll('[data-scroll-about]').forEach(a=>a.addEventListener('click',(ev)=>{if(state.route===''){ev.preventDefault();document.getElementById('about')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}else {ev.preventDefault();location.hash=loc();setTimeout(()=>document.getElementById('about')?.scrollIntoView({behavior:'smooth'}),80);}}));
 window.PortfolioNetwork.mount({db,state,lang:state.lang,loc});document.querySelectorAll('[data-go-tech]').forEach(b=>b.addEventListener('click',()=>{state.selectedTech=b.dataset.goTech;state.networkSelected='t:'+(db.technologies.find(t=>t.name===state.selectedTech)?.id||'tech-01');location.hash=loc();setTimeout(()=>document.getElementById('tech')?.scrollIntoView({behavior:'smooth'}),110);}));
 const prSearch=document.getElementById('project-search');function updateProjects(){const pp=db.projects.filter(p=>{const hay=(p.name+' '+(p.summary_ko||'')+' '+(p.summary_en||'')+' '+db.technologies.filter(t=>t.linked_project_slugs.includes(p.slug)).map(t=>t.name).join(' ')).toLowerCase();return (!state.search||hay.includes(state.search.toLowerCase()))&&(state.filter==='all'||p.status===state.filter)&&(state.year==='all'||(p.started_at||p.started_month||'').startsWith(state.year))&&(state.type==='all'||p.project_type===state.type)&&(state.tech==='all'||db.technologies.some(t=>t.name===state.tech&&t.linked_project_slugs.includes(p.slug)));});pp.sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name):(state.sort==='oldest'?1:-1)*(a.started_at||a.started_month||'').localeCompare(b.started_at||b.started_month||''));document.getElementById('project-results').innerHTML=projectResults(pp);document.getElementById('result-count').textContent=pp.length+' / 19';}
 prSearch?.addEventListener('input',e=>{state.search=e.target.value;updateProjects()});[['project-status','filter'],['project-year','year'],['project-tech','tech'],['project-type','type'],['project-sort','sort']].forEach(([id,key])=>document.getElementById(id)?.addEventListener('change',e=>{state[key]=e.target.value;updateProjects()}));
 document.querySelectorAll('[data-rec-tab]').forEach(b=>b.addEventListener('click',()=>{state.recFilter=b.dataset.recTab;render();}));document.querySelectorAll('[data-exp-tab]').forEach(b=>b.addEventListener('click',()=>{state.expFilter=b.dataset.expTab;render();}));document.getElementById('experience-search')?.addEventListener('input',e=>{state.expSearch=e.target.value;const a=makeExperienceRecords().filter(x=>(state.expFilter==='all'||x.kind===state.expFilter||(state.expFilter==='global'&&/LPU|대만|호주|글로벌 프론티어/.test(x.title)))&&(!state.expSearch||(x.title+' '+(x.role||'')).toLowerCase().includes(state.expSearch.toLowerCase()))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('exp-results').innerHTML=experienceRows(a);});
 if(io)io.disconnect();const sections=[...document.querySelectorAll('[data-chapter]')];const reveal=[...document.querySelectorAll('.reveal')];if('IntersectionObserver' in window){const motionObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');motionObserver.unobserve(e.target);}}),{threshold:.09});reveal.forEach(x=>motionObserver.observe(x));io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){document.getElementById('chapter-label').textContent=e.target.dataset.chapter;document.getElementById('chapter-count').textContent=String(Math.max(1,sections.indexOf(e.target)+1)).padStart(2,'0')+' / '+String(sections.length).padStart(2,'0');}})},{rootMargin:'-28% 0px -55% 0px',threshold:0});sections.forEach(s=>io.observe(s));}else reveal.forEach(x=>x.classList.add('in-view'));
 updateProgress();}
function updateProgress(){const total=document.documentElement.scrollHeight-innerHeight;document.getElementById('reading-progress')?.style.setProperty('width',(total>0?(scrollY/total*100):0)+'%');}
window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('hashchange',()=>{const switchPage=()=>{render();window.scrollTo({top:0,behavior:'instant'});};if(document.startViewTransition&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){document.startViewTransition(switchPage);}else switchPage();});
if(!location.hash)location.hash='#/ko';else render();

function intro(){let seen=false;try{seen=sessionStorage.getItem('ks_intro_seen')==='1';sessionStorage.setItem('ks_intro_seen','1');}catch{}if(seen||window.matchMedia('(prefers-reduced-motion: reduce)').matches||state.route)return;const layer=document.createElement('div');layer.className='opening-layer';layer.innerHTML='<div class="opening-frame"><small>A PORTFOLIO BY</small><strong>KIM SIHO</strong><i></i></div><button class="skip-intro">SKIP ↗</button>';document.body.appendChild(layer);const skip=()=>{layer.classList.add('out');setTimeout(()=>layer.remove(),650)};layer.querySelector('button').addEventListener('click',skip);setTimeout(skip,1700)}
setTimeout(intro,50);
})();
